<!DOCTYPE html>
<html>
<head>
    <title>Awesome Tanks</title>
    <link rel="stylesheet" href="style.css">

    <!-- Ruffle -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

<div class="navbar">
    <h1>Class Source</h1>
    <div>
        <a href="index.html">Home</a>
        <a href="games.html">All Games</a>
    </div>
</div>

<h2>Awesome Tanks</h2>

<div id="game-container" style="width:800px; height:600px; margin:auto;"></div>

<script>
window.addEventListener("load", () => {
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();

    player.style.width = "800px";
    player.style.height = "600px";

    document.getElementById("game-container").appendChild(player);

    player.load("587840_awesomeTanks (2).swf");
});
</script>

</body>
</html>
